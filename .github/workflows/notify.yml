name: Notifications Ralass
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/210033045243/locations/global/workloadIdentityPools/github/providers/github
          service_account: firebase-adminsdk-fbsvc@ralass.iam.gserviceaccount.com
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
        working-directory: scripts
      - run: node notify.mjs
        working-directory: scripts
        env:
          APP_URL: https://ouassimno.github.io/Ralass/
