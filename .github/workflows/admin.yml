name: Admin Ralass
on:
  workflow_dispatch:
    inputs:
      mode: { description: 'list ou delete', default: 'list' }
      expense_id: { description: 'id de la dépense', default: '' }
permissions:
  contents: read
  id-token: write
jobs:
  admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/210033045243/locations/global/workloadIdentityPools/github/providers/github
          service_account: firebase-adminsdk-fbsvc@ralass.iam.gserviceaccount.com
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
        working-directory: scripts
      - run: node admin.mjs
        working-directory: scripts
        env:
          MODE: ${{ inputs.mode }}
          EXPENSE_ID: ${{ inputs.expense_id }}
